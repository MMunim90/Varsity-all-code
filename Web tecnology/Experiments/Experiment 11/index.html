<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 11</title>
</head>
<body>
    <script>
        for (let i = 0; i <= 40; i++) {
            let message;
            
            if (i % 2 === 0) {
                message = i + " is even";
            } else {
                message = i + " is odd";
            }
            
            document.write(message + "<br>");
        }
        
    </script>
</body>
</html>
